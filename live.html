<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liwa — Live Venue Info</title>
<meta name="description" content="Venue policies, weather, and transportation info for your event — the Liwa web view, built for Android and desktop.">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/live.css">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d97706">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="/" class="logo" aria-label="Liwa home">
      <img class="logo-mark" src="assets/favicon-48.png" alt="" width="28" height="28">
      <span>Liwa</span>
    </a>
    <nav class="header-nav">
      <a href="index.html#how-it-works">How it works</a>
      <a href="index.html#principle">Our promise</a>
    </nav>
  </div>
</header>

<main class="wrap live-wrap">

  <div id="venue-loading" class="loading-state">Loading venue info…</div>

  <div id="venue-content" class="venue-content" hidden>
    <div id="hero-image-wrap" class="hero-image-wrap" hidden>
      <img id="hero-image" class="hero-image" alt="">
      <p id="hero-attribution" class="hero-attribution"></p>
    </div>

    <div class="venue-header">
      <h1 id="venue-name"></h1>
      <p id="venue-meta" class="venue-meta"></p>
    </div>

    <section class="live-section">
      <h2>Weather</h2>
      <div id="weather-block" class="unknown-block"></div>
    </section>

    <section class="live-section">
      <h2>Getting there</h2>
      <div id="transport-list" class="transport-list"></div>
    </section>

    <section class="live-section">
      <h2>Merch</h2>
      <div id="merch-list" class="transport-list"></div>
    </section>

    <section class="live-section">
      <h2>Policies</h2>
      <div id="policy-list" class="policy-list"></div>
    </section>

    <p class="provenance-note">
      Every fact above is sourced and tiered by how well it's verified. Anything Liwa can't
      confirm is left blank rather than guessed — that's the whole point.
    </p>

    <p id="debug-badge" class="debug-badge"></p>
  </div>

</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span>&copy; <span id="year"></span> Liwa</span>
    <a href="mailto:hello@liwaapp.org">hello@liwaapp.org</a>
  </div>
</footer>

<script type="module" src="js/live.js"></script>
<script src="js/main.js"></script>
</body>
</html>
